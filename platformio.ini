[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; DTR/RTS=0: не ресетить ESP при открытии монитора / don't reset ESP on monitor open
monitor_dtr = 0
monitor_rts = 0
build_flags =
  ; Serial = UART0 (CH343), не native USB-CDC / Serial is UART0, not native USB-CDC
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
